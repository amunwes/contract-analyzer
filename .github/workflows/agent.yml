name: Agent — plan

on:
  issues:
    types: [labeled]

jobs:
  plan:
    if: github.event.label.name == 'agent'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowedTools "Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh repo view:*),Read,LS"'
          prompt: |
            You are the lead agent for this repository. Read .claude/CLAUDE.md first before doing anything else.

            The 'agent' label was just added to issue #${{ github.event.issue.number }}.

            Issue title: ${{ github.event.issue.title }}

            Issue body:
            ${{ github.event.issue.body }}

            Follow Steps 1 and 2 of the lead agent workflow defined in CLAUDE.md:
            1. Read and understand the issue. Explore the relevant parts of the codebase.
            2. Post a plan as a comment on issue #${{ github.event.issue.number }} using the format in .claude/commands/plan-issue.md
            3. Stop. Do not write any code.
