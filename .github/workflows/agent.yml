name: Agent workflow

on:
  issues:
    types: [labeled]

jobs:
  run-agent:
    if: github.event.label.name == 'agent'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: |
            contract-analyzer/package-lock.json
            contract-analyzer/backend/package-lock.json

      - name: Install frontend deps
        run: npm install --prefix contract-analyzer

      - name: Install backend deps
        run: npm install --prefix contract-analyzer/backend

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Install Python deps
        run: pip install metagpt

      - name: Run orchestrator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python scripts/orchestrator.py
