name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: |
            contract-analyzer/package-lock.json
            contract-analyzer/backend/package-lock.json

      - name: Install frontend deps
        run: npm install --prefix contract-analyzer

      - name: Install backend deps
        run: npm install --prefix contract-analyzer/backend

      - name: Lint
        run: npx biome lint . --prefix contract-analyzer
